name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the minimum the benchmark documents; 22 is what it is developed on.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so the release-consistency check has something to compare against.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Nothing to install: the tests have no dependencies and make no network
      # calls. Agent invocations are never run here — they cost money and need
      # credentials CI has no business holding.
      - name: Repository structure, documentation links and version metadata
        run: node --test tests/repository.test.mjs

      - name: Benchmark scorer and ground truth
        run: node --test tests/evals/*.test.mjs
