<svg xmlns="http://www.w3.org/2000/svg" width="800" height="216" viewBox="0 0 800 216" role="img" aria-labelledby="title description">
  <title id="title">GitHub README Generator</title>
  <desc id="description">A mint document with a folded corner, text lines and a check mark on a dark navy panel, representing a README grounded in verified repository sources.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="800" y2="216" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142536"/>
      <stop offset="1" stop-color="#0b1422"/>
    </linearGradient>
    <linearGradient id="document" x1="68" y1="52" x2="148" y2="164" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="798" height="214" rx="24" fill="url(#panel)" stroke="#2a4052" stroke-width="2"/>
  <rect x="28" y="28" width="160" height="160" rx="24" fill="#102331" stroke="#2a4956"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 52h45l23 23v77a12 12 0 0 1-12 12H80a12 12 0 0 1-12-12V64a12 12 0 0 1 12-12Z" stroke="url(#document)" stroke-width="8"/>
    <path d="M124 53v23h23" stroke="#a7f3d0" stroke-width="6"/>
    <path d="M88 92h24M88 108h40" stroke="#64dfc8" stroke-width="6"/>
    <path d="m93 136 10 10 22-23" stroke="#a7f3d0" stroke-width="8"/>
  </g>
  <text x="224" y="102" fill="#f1f7fa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="700" letter-spacing="-2">readme<tspan fill="#a7f3d0">.</tspan></text>
  <text x="227" y="138" fill="#d0dfe7" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="600" letter-spacing="4">GENERATOR</text>
  <path d="M612 61v94" stroke="#2a4052" stroke-width="2"/>
  <g fill="#9db7c6" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" letter-spacing="2">
    <text x="644" y="80">SCAN</text>
    <text x="644" y="113">VERIFY</text>
    <text x="644" y="146">WRITE</text>
  </g>
  <g fill="#64dfc8">
    <circle cx="629" cy="76" r="3"/>
    <circle cx="629" cy="109" r="3"/>
    <circle cx="629" cy="142" r="3"/>
  </g>
</svg>
